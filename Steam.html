<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Steam</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%231b2838'/%3E%3Ccircle cx='68' cy='30' r='13' fill='none' stroke='white' stroke-width='7'/%3E%3Cline x1='27' y1='65' x2='60' y2='38' stroke='white' stroke-width='9'/%3E%3Ccircle cx='24' cy='70' r='12' fill='none' stroke='white' stroke-width='7'/%3E%3C/svg%3E">

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: black;
}

body {
    font-family: Consolas, monospace;
}

#screen {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

#text {
    white-space: pre-line;
    font-weight: bold;
    font-size: clamp(20px, 3vw, 48px);
    line-height: 1.25;
    padding: 30px;
}

.green {
    color: #00ff00;
}

.red {
    color: red;
}

.black {
    color: black;
}
</style>
</head>

<body>

<div id="screen">
    <div id="text" class="green"></div>
</div>

<script>

const screen = document.getElementById("screen");
const text = document.getElementById("text");

function randomBinary() {
    let output = "";

    for (let i = 0; i < 25; i++) {
        let line = "";

        for (let j = 0; j < 60; j++) {
            line += Math.random() < 0.5 ? "0" : "1";
        }

        output += line + "\n";
    }

    return output;
}

/* 1 — CÓDIGO BINÁRIO */

text.textContent = randomBinary();

setTimeout(() => {

    /* 2 — DADOS CRIPTOGRAFADOS */

    let count = 0;

    const blink = setInterval(() => {

        if (count % 2 === 0) {

            text.className = "red";

            text.textContent =
                "SEUS DADOS FORAM CRIPTOGRAFADOS,\n\n" +
                "AGORA VOCÊ VAI SER HACKEADO\n\n" +
                "ENVIE R$10.000 PARA RECUPERAR SEUS DADOS!";

        } else {

            text.className = "black";

        }

        count++;

        if (count >= 20) {

            clearInterval(blink);

            /* 3 — HACKERS */

            screen.style.background = "green";

            text.className = "black";

            text.textContent =
                "HACKER EMANUEL + CHATGPT";

            setTimeout(() => {

                /* 4 — REVELAÇÃO */

                screen.style.background = "black";

                text.className = "green";

                text.textContent =
                    "PEGADINHA KKKKK\n\n" +
                    "SEUS DADOS NÃO FORAM CRIPTOGRAFADOS!";

            }, 5000);
        }

    }, 300);

}, 5000);

</script>

</body>
</html>
